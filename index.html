<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dólar Gráfico</title>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- HAMMER -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>

<!-- ZOOM -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 6px;
  background: #0b1120;
  color: #e5e7eb;
  font-family: Arial, sans-serif;
}

h1 {
  text-align: center;
  margin: 4px 0 10px;
  font-size: clamp(21px, 5vw, 28px);
  font-weight: 800;
  color: #f8fafc;
}

#cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-bottom: 10px;
}

.card {
  min-width: 0;
  padding: 8px;
  text-align: left;
  background: linear-gradient(145deg, #182338, #111a2b);
  border: 1px solid #28364c;
  border-radius: 14px;
  box-shadow: 0 4px 12px #00000020;
}

.card h3 {
  margin: 0 0 5px;
  color: #a5b4fc;
  font-size: 13px;
  font-weight: 700;
}

.card div {
  margin-top: 3px;
  color: #cbd5e1;
  font-size: 12px;
}

.valor {
  font-size: 15px;
  font-weight: 800;
  color: #f8fafc;
  overflow-wrap: anywhere;
}

#botones,
#rangos {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px;
  margin: 0 0 8px;
}

button {
  min-height: 32px;
  padding: 6px 9px;
  border: 1px solid #334155;
  border-radius: 10px;
  background: #1e293b;
  color: #e2e8f0;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  transition: background .15s, color .15s;
}

button.activo {
  background: #34d399;
  border-color: #34d399;
  color: #052e24;
}

button.activoRango {
  background: #fbbf24;
  border-color: #fbbf24;
  color: #422006;
}

#graficoBox {
  position: relative;
  width: 100%;
  height: clamp(280px, 52vh, 420px);
  padding: 6px;
  margin-top: 4px;
  overflow: hidden;
  background: #111a2b;
  border: 1px solid #28364c;
  border-radius: 16px;
}

canvas {
  display: block;
  max-width: 100%;
}

@media (min-width: 600px) {
  body {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
  }

  #cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .card {
    padding: 16px;
  }

  .valor {
    font-size: 19px;
  }
}

@media (max-width: 360px) {
  body {
    padding: 8px;
  }

  #cards {
    gap: 7px;
  }

  .card {
    padding: 10px 8px;
  }

  .valor {
    font-size: 15px;
  }

  button {
    padding: 8px 10px;
    font-size: 12px;
  }
}
</style>

</head>

<body>

<h1>📈 Cotización Dólar</h1>

<!-- =====================
CARDS
===================== -->

<div id="cards">

<div class="card">

<h3>Blue</h3>

<div id="blue_c"
class="valor"></div>

<div id="blue_v"></div>

</div>

<div class="card">

<h3>Oficial</h3>

<div id="oficial_c"
class="valor"></div>

<div id="oficial_v"></div>

</div>

<div class="card">

<h3>Cripto</h3>

<div id="cripto_c"
class="valor"></div>

<div id="cripto_v"></div>

</div>

<div class="card">

<h3>P2P Bolivia</h3>

<div id="p2p_c"
class="valor"></div>

<div id="p2p_v"></div>

</div>

<div class="card">

<h3>BCB</h3>

<div id="bcb_c"
class="valor"></div>
<div id="bcb_v"></div>

</div>

<div class="card">

<h3>ARS → Bs</h3>

<div id="ars_c"
class="valor"></div>

<div id="ars_v"></div>

</div>

</div>

<!-- =====================
BOTONES MONEDAS
===================== -->

<div id="botones">

<button
class="activo"
onclick="cambiar('azul')">

Blue

</button>

<button
onclick="cambiar('oficial')">

Oficial

</button>

<button
onclick="cambiar('cripto_ars')">

Cripto

</button>

<button
onclick="cambiar('p2p_bob')">

P2P Bolivia

</button>
<button
onclick="cambiar('bcb')">

BCB

</button>
<button
onclick="cambiar('ars_bob')">

ARS → Bs

</button>

</div>

<!-- =====================
RANGOS
===================== -->

<div id="rangos">

<button
class="activoRango"
onclick="cambiarRango('dia')">

Día

</button>

<button
onclick="cambiarRango('semana')">

Semana

</button>

<button
onclick="cambiarRango('mes')">

Mes

</button>

<button onclick="cambiarRango('anio')">Año</button>
</div>

<!-- =====================
GRAFICO
===================== -->

<div id="graficoBox">

<canvas id="grafico"></canvas>

</div>

<script>

// registrar zoom
Chart.register(ChartZoom);

//temporal
console.log("Chart.js:", typeof Chart);
console.log("ChartZoom:", typeof ChartZoom);
//__

// =====================
// VARIABLES
// =====================

let chart;

let moneda = "azul";

let rango = "dia";

// =====================
// CARGAR DATOS
// =====================

async function cargar(){

  try{

    let res =
      await fetch(
        "/dolar?rango=" + rango
      );

    let data =
      await res.json();
//temporal

console.log("Respuesta API:", data);
console.log("Historial seleccionado:", moneda, data.historial?.[moneda]?.length);
console.log("Canvas:", document.getElementById("grafico"));
//--

    let actual =
      data.actual;

    // =================
    // ACTUALES
    // =================

    blue_c.innerText =
      "C " +
      actual.azul.valor_compra;

    blue_v.innerText =
      "V " +
      actual.azul.valor_venta;

    oficial_c.innerText =
      "C " +
      actual.oficial.valor_compra;

    oficial_v.innerText =
      "V " +
      actual.oficial.valor_venta;

    cripto_c.innerText =
      "C " +
      actual.cripto_ars.compra;

    cripto_v.innerText =
      "V " +
      actual.cripto_ars.venta;

    p2p_c.innerText =
      "C " +
      actual.p2p_bob.compra;

    p2p_v.innerText =
      "V " +
      actual.p2p_bob.venta;

bcb_c.innerText =
      "C " +
      actual.bcb.compra;

    bcb_v.innerText =
      "V " +
      actual.bcb.venta;


    ars_c.innerText =
      "C " +
      actual.ars_bob.compra
      .toFixed(5);

    ars_v.innerText =
      "V " +
      actual.ars_bob.venta
      .toFixed(5);

    // =================
    // GRAFICO
    // =================

    actualizarGrafico(
      data.historial[moneda]
    );

  }catch(e){

    console.log(e);
  }
}

// =====================
// ACTUALIZAR GRAFICO
// =====================

function actualizarGrafico(datos){

  let labels =

    datos.map(

      x =>

        //new Date(x.tiempo)
new Date(x.fecha)
        .toLocaleString()
    );

  let compra =

    datos.map(
      x => x.compra
    );

  let venta =

    datos.map(
      x => x.venta
    );

  // =====================
  // CREAR SOLO 1 VEZ
  // =====================

  if(!chart){

    chart = new Chart(

      document
      .getElementById("grafico"),

      {

        type:"line",

        data:{

          labels,

          datasets:[

            {

              label:"Compra",

              data:compra,

              borderWidth:2,

              tension:0.3
            },

            {

              label:"Venta",

              data:venta,

              borderWidth:2,

              tension:0.3
            }
          ]
        },

        options:{

          animation:{

            duration:600
          },

          responsive:true,

          maintainAspectRatio:false,

          interaction:{

            mode:"index",

            intersect:false
          },

          plugins:{

            legend:{

              labels:{

                color:"white"
              }
            },

/*
tooltip:{

  callbacks:{

    label:function(context){

      return context.dataset.label +

      ": " +

      Number(
        context.parsed.y
      ).toFixed(5);
    }
  }
},
*/
tooltip:{

  callbacks:{

    label:function(context){

      return context.dataset.label +

      ": " +

      (

        context.parsed.y < 1

        ? Number(
            context.parsed.y
          ).toFixed(5)

        : context.parsed.y
      );
    }
  }
},
             zoom:{

              pan:{

                enabled:true,

                mode:"x"
              },

              zoom:{

                wheel:{

                  enabled:true
                },

                pinch:{

                  enabled:true
                },

                drag:{

                  enabled:true
                },

                mode:"x"
              }
            }
          },

          scales:{

            x:{

              ticks:{

                color:"white"
              }
            },

            y:{

              ticks:{

                color:"white"
              }
            }
          }
        }
      }
    );

    return;
  }

  // =====================
  // ACTUALIZAR DATOS
  // =====================

  chart.data.labels =
    labels;

  chart.data.datasets[0].data =
    compra;

  chart.data.datasets[1].data =
    venta;

  chart.update();
}

// =====================
// CAMBIAR MONEDA
// =====================

function cambiar(m){

  moneda = m;

  document
  .querySelectorAll(
    "#botones button"
  )
  .forEach(b=>

    b.classList.remove(
      "activo"
    )
  );

  event.target
  .classList.add(
    "activo"
  );

  cargar();
}

// =====================
// CAMBIAR RANGO
// =====================

function cambiarRango(r){

  rango = r;

  document
  .querySelectorAll(
    "#rangos button"
  )
  .forEach(b=>

    b.classList.remove(
      "activoRango"
    )
  );

  event.target
  .classList.add(
    "activoRango"
  );

  cargar();
}

// =====================
// RESET ZOOM
// =====================

document
.getElementById("grafico")
.ondblclick = ()=>{

  if(chart){

    chart.resetZoom();
  }
};

// =====================
// AUTO ACTUALIZAR
// =====================

setInterval(cargar,60000);

cargar();

</script>

</body>

</html>
